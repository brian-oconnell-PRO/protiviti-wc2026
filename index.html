<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Protiviti World Cup 2026 Sweepstakes</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;600;800&family=Oswald:wght@600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;font-family:Inter;background:#081a2f;color:#fff;padding:20px}
.app{max-width:1200px;margin:auto}
.panel{background:#0d1f36;border-radius:14px;margin-bottom:16px;border:1px solid #233d5f}
th,td{padding:10px}
table{width:100%}
.team-button{padding:8px;border:1px solid #355d82;background:#10263f;color:#fff;border-radius:8px;cursor:pointer}
.team-button:hover{background:#163a5c}
.match-centre{padding:12px;background:#060f1f}
.flag{margin-right:6px}
</style>
</head>
<body>
<div class="app">
<h1>🏆 Protiviti World Cup 2026 Sweepstakes</h1>

<div class="panel">
<table>
<thead><tr><th>Player</th><th>Team 1</th><th>Team 2</th><th>Team 3</th></tr></thead>
<tbody id="lbBody"></tbody>
</table>
</div>

<div class="panel match-centre" id="matchCentre">Select a team</div>
</div>

<script>
var DATA_URL='leaderboard.json';
var TEAM_RESULTS={};

var FLAG_MAP={
"Mexico":"🇲🇽","Australia":"🇦🇺","Norway":"🇳🇴","Egypt":"🇪🇬","England":"🏴","Austria":"🇦🇹"
};

function getFlag(team){return FLAG_MAP[team]||"🏳️"}

function renderMatchCentre(team,pts){
var matches=TEAM_RESULTS[team]||[];
var html='<h2><span class="flag">'+getFlag(team)+'</span>'+team+' ('+pts+' pts)</h2>';

matches.forEach(function(m){
html+='<div><span class="flag">'+getFlag(m.vs)+'</span>vs '+m.vs+' '+(m.score||"Upcoming")+'</div>';
});

document.getElementById('matchCentre').innerHTML=html;
}

function teamButton(name,pts){
return '<button class="team-button" data-team="'+name+'" data-pts="'+pts+'">'+name+' ('+pts+')</button>'
}

function render(data){
TEAM_RESULTS=data.teamResults||{};
var rows=data.leaderboard||[];

var html=rows.map(function(p){
return '<tr>'+
'<td>'+p.playerName+'</td>'+
'<td>'+teamButton(p.team1,p.team1Pts)+'</td>'+
'<td>'+teamButton(p.team2,p.team2Pts)+'</td>'+
'<td>'+teamButton(p.team3,p.team3Pts)+'</td>'+
'</tr>';
}).join('');

document.getElementById('lbBody').innerHTML=html;
}

function load(){
fetch(DATA_URL).then(r=>r.json()).then(render);
}

// interactions
document.addEventListener('mouseover',function(e){
var btn=e.target.closest('.team-button');
if(btn)renderMatchCentre(btn.dataset.team,btn.dataset.pts);
});

document.addEventListener('DOMContentLoaded',load);
</script>
</body>
</html>
